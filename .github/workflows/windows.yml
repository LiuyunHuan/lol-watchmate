name: Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore Riot asset cache
        uses: actions/cache@v4
        with:
          path: |
            public/champions/*.png
            public/champions/*.jpg
            public/champions/variants/*.png
          key: riot-champions-16.21.1-v1
      - name: Fetch Riot champion assets
        run: |
          npm run assets:champions -- 16.21.1
          npm run assets:champion-variants
      - run: npm run check
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: LOL-Watchmate-Windows
          path: release/*Setup.exe
